name: "CodeQL"

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Detect languages
        id: set
        run: |
          MATRIX='[]'
          if find . -maxdepth 4 -name 'package.json' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' | head -1 | grep -q .; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"language":"javascript-typescript","build-mode":"none"}]')
          fi
          if find . -maxdepth 4 -name 'go.mod' -o -name '*.go' | head -1 | grep -q .; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"language":"go","build-mode":"autobuild"}]')
          fi
          if find . -maxdepth 4 -name 'requirements.txt' -o -name 'pyproject.toml' -o -name '*.py' | head -1 | grep -q .; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"language":"python","build-mode":"none","continue-on-error":true}]')
          fi
          if find . -maxdepth 4 -name 'Cargo.toml' -o -name '*.rs' | head -1 | grep -q .; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"language":"rust","build-mode":"none","continue-on-error":true}]')
          fi
          if find . -maxdepth 4 -name 'pom.xml' -o -name 'build.gradle' -o -name '*.java' -o -name '*.kt' | head -1 | grep -q .; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"language":"java-kotlin","build-mode":"autobuild","continue-on-error":true}]')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error || false }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Build manually for custom build modes.'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
