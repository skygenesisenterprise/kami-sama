services:
  # ─── Frontend (Next.js) ─────────────────────────────────────────────────────
  # Dev:  NODE_ENV=development → `pnpm next dev` on :3000 (source bind-mounted)
  # Prod: NODE_ENV=production  → http-server serving /app/out (static export)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
        DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
    image: skygenesisenterprise/kami-sama:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    command: server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_PORT: "3000"
      API_INTERNAL_URL: http://worker:8080/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_REALTIME_URL: /api/v1/realtime/ws
      NEXT_PUBLIC_USE_PLATFORM_MOCKS: ${NEXT_PUBLIC_USE_PLATFORM_MOCKS:-false}
      HTTP_ACCESS_LOGS: ${HTTP_ACCESS_LOGS:-false}
    volumes:
      - ./apps:/app/apps
      - /app/apps/node_modules
      - /app/apps/.next
      - ./entrypoint.sh:/entrypoint.sh
      - certs:/certs
      - custom-templates:/templates
    depends_on:
      worker:
        condition: service_started
    networks:
      - kami-sama

  # ─── API / worker (Go) ──────────────────────────────────────────────────────
  # Dev:  WORKER_COMMAND=air    → hot-reload via Air (:8080)
  # Prod: WORKER_COMMAND=worker → compiled binary, mode `worker` (:8080)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
        DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
    image: skygenesisenterprise/kami-sama:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    command: ${WORKER_COMMAND:-air}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      start_period: ${WORKER_START_PERIOD:-180s}
      interval: 5s
      retries: 10
      timeout: 5s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      USE_EMBEDDED_DB: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GORM AutoMigrate (server/main.go) is the single schema owner.
      # prisma db push --accept-data-loss was dropping/recreating the
      # collections status/type/visibility/metadata_status columns on every
      # boot (GORM stores them as text, Prisma expects enums), wiping data.
      PRISMA_SCHEMA_DEPLOY: "false"
      PRISMA_SCHEMA_DEPLOY_STRATEGY: ${PRISMA_SCHEMA_DEPLOY_STRATEGY:-push}
      ALLOW_MIGRATION_FAILURE: ${ALLOW_MIGRATION_FAILURE:-false}
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
      REDIS_DB: "0"
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-dev-password}@redis:6379/0
      REDIS_KEY_PREFIX: kami-sama:v1
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-kami-sama}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.kami-sama.localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://kami-sama.localhost,http://api.kami-sama.localhost,http://sso.kami-sama.localhost,http://studios.kami-sama.localhost,http://media.kami-sama.localhost,http://data.kami-sama.localhost,http://rabbitmq.kami-sama.localhost,http://search.kami-sama.localhost,http://localhost:3000,http://127.0.0.1:8081}
      LISTEN__TRUSTED_PROXY_CIDRS: 0.0.0.0/0,::/0
      API_PORT: "8080"
      HOST: ${DOMAIN_HOST:-kami-sama.localhost}
      POSTGRESQL__HOST: postgresql
      POSTGRESQL__PORT: "5432"
      POSTGRESQL__USER: ${PG_USER:-postgres}
      POSTGRESQL__NAME: ${PG_DB:-postgres}
      POSTGRESQL__PASSWORD: ${PG_PASS:-postgres}
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      # ── Media source (media-server / streaming engine) ──────────────────
      # Content catalog: the dashboard sources (Plex, …) feed the DB.
      # Jellyfin is NOT a content provider — it only backs streaming: the
      # worker resolves stream URLs against the media-server and proxies
      # them to the browser for the /watch page (no direct client access).
      # MEDIA_SOURCE_CACHE_TTL also bounds the in-process stream-key
      # resolution cache (see routes/discover.go) that stops the /stream and
      # proxy endpoints from re-searching the media server on every episode.
      MEDIA_SOURCE_ENABLED: ${MEDIA_SOURCE_ENABLED:-true}
      MEDIA_SOURCE_TYPE: ${MEDIA_SOURCE_TYPE:-plex}
      MEDIA_SOURCE_JELLYFIN_URL: ${MEDIA_SOURCE_JELLYFIN_URL:-http://media-server:8096}
      MEDIA_SOURCE_JELLYFIN_API_KEY: ${MEDIA_SOURCE_JELLYFIN_API_KEY:-795337733c3d47778b206b7f469b1467}
      MEDIA_SOURCE_JELLYFIN_USER_ID: ${MEDIA_SOURCE_JELLYFIN_USER_ID:-c8aa35777aae4664a0d4904d814a0e78}
      MEDIA_SOURCE_SYNC_INTERVAL: ${MEDIA_SOURCE_SYNC_INTERVAL:-1h}
      MEDIA_SOURCE_STREAM_PROFILE: ${MEDIA_SOURCE_STREAM_PROFILE:-native}
      MEDIA_SOURCE_CACHE_TTL: ${MEDIA_SOURCE_CACHE_TTL:-5m}
      # ── Plex → Jellyfin .strm bridge ─────────────────────────────────────
      # When the catalog source is a content-only provider (Plex), the worker
      # writes a .strm file containing the provider's direct file URL into a
      # shared directory (MEDIA_SOURCE_JELLYFIN_STRM_DIR) that Jellyfin
      # watches as a library. Both containers must mount the SAME volume at
      # the same path so the worker's write is visible to the media-server's
      # library scan. Jellyfin then acts purely as the streaming engine
      # (transcodes the remote URL to HLS) — see routes/discover.go.
      MEDIA_SOURCE_JELLYFIN_STRM_DIR: ${MEDIA_SOURCE_JELLYFIN_STRM_DIR:-/remote-media}
      MEDIA_SOURCE_JELLYFIN_STRM_LIBRARY: ${MEDIA_SOURCE_JELLYFIN_STRM_LIBRARY:-Remote}
      MEDIA_SOURCE_JELLYFIN_STRM_LIBRARY_PATH: ${MEDIA_SOURCE_JELLYFIN_STRM_LIBRARY_PATH:-/remote-media}
      ANILIST_ENABLED: ${ANILIST_ENABLED:-true}
      ANILIST_CACHE_TTL: ${ANILIST_CACHE_TTL:-5m}
    volumes:
      - ./server:/app/server
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./entrypoint.sh:/entrypoint.sh
      - ./.air.toml:/app/.air.toml
      - gopkg:/go/pkg
      - certs:/certs
      - custom-templates:/templates
      # Shared with media-server: worker writes .strm bridge files here.
      - remote-media:/remote-media
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      # Started (not healthy) on purpose: the video part must stay decoupled —
      # Jellyfin first boot (setup wizard) can outlast its healthcheck start
      # period, and a media-server outage should never block the API/catalog.
      media-server:
        condition: service_started
    networks:
      - kami-sama

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # Runs through the unified entrypoint (`command: postgresql`); applies the
  # Prisma schema on boot and watches for changes when PRISMA_HOT_RELOAD=true.
  postgresql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
    image: skygenesisenterprise/kami-sama:${APP_IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    command: postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/prisma/schema.prisma:/app/server/prisma/schema.prisma:ro
      - ./server/prisma/package.json:/app/server/prisma/package.json:ro
      - ./infrastructure/docker/deploy-schema.sh:/usr/local/bin/deploy-schema.sh:ro
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_DB: ${PG_DB:-postgres}
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@localhost:5432/${PG_DB:-postgres}
      # Schema ownership is delegated to GORM AutoMigrate (see worker). Prisma
      # auto-deploy is disabled to stop db push from resetting collection
      # status/type/visibility columns on every container start.
      PRISMA_SCHEMA_DEPLOY: "false"
      PRISMA_SCHEMA_DEPLOY_STRATEGY: ${PRISMA_SCHEMA_DEPLOY_STRATEGY:-push}
      PRISMA_MIGRATE_DEPLOY: "false"
      PRISMA_HOT_RELOAD: "false"
      PRISMA_POLL_INTERVAL: ${PRISMA_POLL_INTERVAL:-5}
      ALLOW_MIGRATION_FAILURE: "true"
    expose:
      - "5432"
    networks:
      - kami-sama

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:-redis-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    expose:
      - "6379"
    networks:
      - kami-sama

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - ${RABBITMQ_AMQP_PORT:-5672}:5672
      - ${RABBITMQ_MGMT_PORT:-15672}:15672
    networks:
      - kami-sama

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      MEILI_ENV: ${MEILI_ENV:-development}
    ports:
      - ${MEILI_PORT:-7700}:7700
    networks:
      - kami-sama

  # ─── Media server (Jellyfin) ────────────────────────────────────────────────
  # Self-hosted media server dedicated to the public /watch page. It is the
  # STREAMING ENGINE of the platform: it owns the movies/series library, the
  # artwork, transcoding and HLS delivery for the player — with no third-party
  # account. Plex (MEDIA_SOURCE_TYPE=plex) is only a CONTENT provider: it
  # feeds the catalog database and never backs playback.
  #
  # How playback works (see routes/discover.go):
  #   1. The worker resolves the Jellyfin item for a catalog title/episode
  #      (MEDIA_SOURCE_JELLYFIN_*), then serves it through a same-origin HLS
  #      proxy so the browser never talks to this container and never needs
  #      CORS or an API key.
  #   2. This container is intentionally NOT exposed to clients through nginx
  #      (the /watch page only reaches it via the worker proxy); port 8096 is
  #      published only so you can set it up and administer it.
  #
  # First boot: open http://localhost:8096, create the admin account, add a
  # library pointing at /media, then grab an API key (Dashboard → API Keys)
  # and set MEDIA_SOURCE_JELLYFIN_API_KEY / _USER_ID in your .env.
  #
  # IMPORTANT for the .strm bridge (remote Plex URLs): Jellyfin probes the URL
  # inside each .strm file with ffmpeg, and its defaults (FFmpeg:probesize=1G,
  # FFmpeg:analyzeduration=200M) make it download up to 1GB from the remote
  # server before producing the HLS manifest — the proxy request hangs and the
  # player dies with response 0. Bound the probe budget via the config keys
  # (see JELLYFIN_FFmpeg__probesize / _analyzeduration below); note the
  # dashboard "probe size limit" setting also drives these same values.
  media-server:
    image: docker.io/jellyfin/jellyfin:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 10s
    # Jellyfin runs long-lived ffmpeg transcode sessions: give it time to
    # terminate them cleanly instead of being SIGKILLed mid-write.
    stop_grace_period: 60s
    ports:
      - ${MEDIA_SERVER_PORT:-8096}:8096
    volumes:
      - media-server-config:/config
      - media-server-cache:/cache
      # Drop your movies/series here (or point MEDIA_LIBRARY_PATH elsewhere).
      - ${MEDIA_LIBRARY_PATH:-./media}:/media:ro
      # Shared with worker: Jellyfin scans this dir for .strm bridge files
      # (remote Plex URLs) which it transcodes to HLS for the /watch player.
      - remote-media:/remote-media
    environment:
      # Tells Jellyfin which address it is reachable at — used by the admin
      # UI for direct links. Playback never relies on it (the worker proxy
      # rebuilds every URL server-side).
      JELLYFIN_PublishedServerUrl: ${MEDIA_SERVER_PUBLIC_URL:-http://localhost:8096}
      # Keep ffmpeg's probe budget tiny so probing a remote Plex URL inside a
      # .strm returns quickly instead of pulling up to 1GB before transcoding.
      JELLYFIN_FFmpeg__probesize: ${JELLYFIN_FFMPEG_PROBESIZE:-2M}
      JELLYFIN_FFmpeg__analyzeduration: ${JELLYFIN_FFMPEG_ANALYZEDURATION:-3000000}
    networks:
      - kami-sama

  # ─── Dev-only services (enable with: docker compose --profile dev up) ────────

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - ${DEV_HTTP_BIND_HOST:-0.0.0.0}:${DEV_HTTP_PORT:-80}:80
    volumes:
      - ./infrastructure/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
      worker:
        condition: service_healthy
    networks:
      - kami-sama

  postgres-data:
    image: docker.io/dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kami-sama.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infrastructure/docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    expose:
      - "80"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - kami-sama

volumes:
  postgres-data:
  redis-data:
  gopkg:
  certs:
  custom-templates:
  rabbitmq-data:
  meilisearch-data:
  pgadmin-data:
  uptime-kuma-data:
  cdn-data:
  media-server-config:
  media-server-cache:
  remote-media:

networks:
  kami-sama:
    driver: bridge